name: Bouwen en controleren

# Bij elke wijziging, en elke ochtend na de Baserow-sync van de scan (06:40 Nederlandse tijd).
# Op main wordt de gebouwde site ook op de branch "site" gezet; de VPS haalt die elke 5 minuten op.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SCAN_ORIGIN: https://scan.newground.nl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          # .htaccess is een verborgen bestand en hoort bij de site.
          include-hidden-files: true
          retention-days: 7

  # Alleen na een geslaagde bouw (tests en controle), en alleen vanaf main: nooit vanuit een pull request.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Site op de branch "site" zetten
        working-directory: dist
        run: |
          git init -q -b site
          git config user.name "Alternatievengids bouw"
          git config user.email "noreply@alternatievengids.nl"
          git add -A
          git commit -q -m "Site van $(date -u '+%Y-%m-%d %H:%M') UTC (bron: ${GITHUB_SHA})"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site

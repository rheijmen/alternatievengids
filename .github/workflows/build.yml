name: Bouwen en controleren

# Bij elke wijziging, en elke ochtend na de Baserow-sync van de scan (06:40 Nederlandse tijd).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SCAN_ORIGIN: https://scan.newground.nl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
      # Publiceren volgt zodra de hosting vaststaat (Hostinger of een andere Europese host).
      # De map dist/ is de hele site: elke statische host kan hem serveren.

name: Bouwen en controleren

# Alleen testen en controleren. Sinds 8 november 2026 wordt de site niet meer gepubliceerd
# (de Gids wordt niet meer onderhouden) en is er geen dagelijkse bouw meer.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SCAN_ORIGIN: https://scan.newground.nl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          # .htaccess is een verborgen bestand en hoort bij de site.
          include-hidden-files: true
          retention-days: 7
